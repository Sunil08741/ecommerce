<div class="user-auth">
   <div *ngIf="!showLogin" class="user-signup">
    <h1>User Sign-up</h1>
    <form #userSignUp="ngForm" class="comman-form" (ngSubmit)="signUp(userSignUp.value)">
        <input 
        type="text"
       placeholder="Enter User Name"
       name="name"
       ngModel
       class="comman-input"
        >
        <input 
        type="text"
       placeholder="Enter User Email"
       name="email"
       ngModel
       class="comman-input"
        >
        <input 
        type="password"
       placeholder="Enter User Password"
       name="password"
       ngModel
       class="comman-input"
        >
        <button class="comman-button">Sign Up</button>
        <p>Already Have Account? <a (click)="openLogin()">Click Here</a></p>
    </form>
   </div>
   <div *ngIf="showLogin" class="user-login">
    <h1>User Login</h1>
    <form #userLogin="ngForm" class="comman-form" (ngSubmit)="login(userLogin.value)">
        <p class="error-p">{{authError}}</p>
        <input 
        type="text"
       placeholder="Enter User Email"
       name="email"
       ngModel
       #email="ngModel"
       required
       email
       class="comman-input"
        >
        <p class="invalid-input"><span *ngIf="email.invalid && email.touched">Please Enter Valid Email</span></p>
        <input 
        type="password"
       placeholder="Enter User Password"
       name="password"
       ngModel
       #password="ngModel"
       required
       minlength="5"
       maxlength="20"
       class="comman-input"
        >
        <p class="invalid-input"><span *ngIf="password.invalid && password.touched">Please Enter Password</span></p>
        <button [disabled]="userLogin.invalid" class="comman-button">Login</button>
        <p>Want to Create Account? <a (click)="openSignUp()">Click Here</a></p>
    </form>
   </div>
</div>
<app-footer></app-footer>
