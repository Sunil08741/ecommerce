<div class="row product-details" *ngIf="productData">
    <div class="col-sm-6">
        <img class="product-img" src="{{productData?.image}}" alt="">
    </div>
    <div class="col-sm-6">
        <div class="details">
            <h1>{{productData.name}}</h1>
            <h3>Price:{{productData.price}}</h3>
            <div>
                Color:
                <h5 [style.backgroundColor]="productData.color" class="product-color"></h5>
            </div>
            <h6>Category:{{productData.category}}</h6>
            <h6>Description:{{productData.description}}</h6>
            <button class="comman-button" >Buy Now</button>
            <button *ngIf="!removeCart" class="comman-button" (click)="addToCart()">Add to Cart</button>
            <button *ngIf="removeCart" class="comman-button" (click)="removeToCart(productData.id)">Remove to Cart</button>

            <div class="quantity-group">
                <button (click)="handleQuantuty('min')">-</button>
                <input type="text" value={{productQuantity}} />
                <button (click)="handleQuantuty('plus')">+</button>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
