<div class="cart-page">
    <h1>Cart Page</h1>
    <div class="row">
        <div class="col-sm-8 details">
            <ul *ngFor="let item of cartData">
                <li>
                    <img src="{{item.image}}"
                        alt="">
                </li>
                <li>
                    <h4>{{item.name}}</h4>
                </li>
                <li>
                    <h4>Price : {{item.price}}</h4>
                </li>
                <li>
                    <h4>Quantity : {{item.quantity}}</h4>
                </li>
                <li>
                    <button class="comman-button" (click)="removeToCart(item.id)">Remove to Cart</button>
                </li>
            </ul>
        </div>
        <div class="col-sm-4 summary">
            <h3>Summary</h3>
            <ul>
                <li><span>Amount</span><span>{{priceSummary.price}}</span></li>
                <li><span>Tax</span><span>{{priceSummary.tax}}</span></li>
                <li><span>Delivery</span><span>{{priceSummary.delivery}}</span></li>
                <li><span>Discount</span><span>{{priceSummary.discount}}</span></li>
                <li><span>
                        <h4>Total</h4>
                    </span><span>
                        <h4>{{priceSummary.total}}</h4>
                    </span></li>
                    <button (click)="checkout()" class="comman-button max-width">Checkout</button>

            </ul>
        </div>
    </div>
</div>
<app-footer></app-footer>
